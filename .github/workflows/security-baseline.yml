name: security-baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  baseline-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fetch the current Supabase security advisors and normalize them into the
      # same shape as .security-scan-baseline.json expects. Uses the Supabase
      # Management API so no scanner service is required in CI.
      - name: Test security advisor response handling
        run: node --test scripts/security-advisor-scan.test.mjs
      - name: Fetch live Supabase security advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/security-advisor-scan.mjs /tmp/security-scan.json

      - name: Compare scan to accepted baseline
        run: node scripts/check-security-baseline.mjs /tmp/security-scan.json
